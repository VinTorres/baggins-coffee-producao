<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | Baggins Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Alegreya:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-forest: #0D1B16;
    --color-moss: #15281F;
    --color-roast: #3B2519;
    --color-cream: #E9E5D3;
    --color-amber: #E0B477;
    --color-leaf: #8DB48A;
    --color-rust: #E0907A;
    --color-crema: #C99A63;
    --font-display: "Almendra", "Palatino Linotype", Georgia, serif;
    --font-body: "Alegreya", Georgia, serif;
  }
  html { color-scheme: dark; }
  body { font-family: var(--font-body); font-size: 1.1rem; background-image: radial-gradient(ellipse at 50% -10%, #1f3d2d 0%, rgba(13,27,22,0) 62%); background-attachment: fixed; }
  .frame { border: 1px solid rgba(224,180,119,.35); box-shadow: inset 0 0 0 5px rgba(0,0,0,.18), inset 0 0 0 6px rgba(224,180,119,.18); }
  h1, h2, h3, .font-display { font-family: var(--font-display); }
  .inp { @apply mt-1 w-full rounded-xl border border-cream/20 bg-forest px-3 py-3 text-cream focus-visible:outline-2 focus-visible:outline-amber; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body class="bg-forest text-cream antialiased">

<header class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-5 py-5">
  <a href="index.html" class="flex items-center gap-2 font-display text-2xl font-bold focus-visible:outline-2 focus-visible:outline-amber"><span class="relative size-6 shrink-0 rounded-full border-2 border-amber bg-leaf/40" aria-hidden="true"><span class="absolute right-1 top-1/2 size-1.5 -translate-y-1/2 rounded-full bg-amber"></span></span>Baggins Coffee</a>
  <nav class="flex flex-wrap items-center justify-end gap-x-5 gap-y-2 text-base font-medium">
    <a class="hover:text-amber focus-visible:outline-2 focus-visible:outline-amber" href="index.html#moagem">Moagem</a>
    <a class="hover:text-amber focus-visible:outline-2 focus-visible:outline-amber" href="index.html#calculadora">Proporção</a>
    <a class="hover:text-amber focus-visible:outline-2 focus-visible:outline-amber" href="methods.html">Métodos</a>
    <a class="hover:text-amber focus-visible:outline-2 focus-visible:outline-amber" href="cafes.html">Cafés</a>
    <a class="hover:text-amber focus-visible:outline-2 focus-visible:outline-amber" href="casas.html">Casas</a>
    <a class="hover:text-amber focus-visible:outline-2 focus-visible:outline-amber" href="legends.html">Legends</a>
    <span id="auth-slot"></span>
  </nav>
</header>

<main class="mx-auto max-w-md px-5 pb-20 pt-8">
  <p class="text-sm font-semibold uppercase tracking-[.2em] text-amber">✦ Gandalf Creations ✦</p>
  <h1 id="titulo" class="mt-1 text-4xl font-bold sm:text-5xl">Entrar</h1>
  <p id="sub" class="mt-2 text-cream/75">Entre para cadastrar cafés, casas e receitas.</p>

  <div role="tablist" aria-label="Entrar ou criar conta" class="mt-8 grid grid-cols-2 gap-2 rounded-full bg-moss p-1">
    <button role="tab" id="tab-login" aria-selected="true" aria-controls="form-login" class="rounded-full px-4 py-2 font-semibold focus-visible:outline-2 focus-visible:outline-amber">Entrar</button>
    <button role="tab" id="tab-cad" aria-selected="false" aria-controls="form-cad" class="rounded-full px-4 py-2 font-semibold focus-visible:outline-2 focus-visible:outline-amber">Criar conta</button>
  </div>

  <form id="form-login" role="tabpanel" aria-labelledby="tab-login" class="mt-6 space-y-4 rounded-3xl bg-moss p-6 frame" novalidate>
    <div>
      <label for="l-email" class="text-sm font-semibold">E-mail</label>
      <input id="l-email" type="email" autocomplete="username" required class="inp">
    </div>
    <div>
      <label for="l-senha" class="text-sm font-semibold">Senha</label>
      <input id="l-senha" type="password" autocomplete="current-password" required class="inp">
    </div>
    <p id="l-err" class="hidden rounded-xl bg-rust/15 px-3 py-2 text-sm text-rust" role="alert"></p>
    <button class="w-full rounded-full bg-amber px-6 py-3 font-semibold text-forest hover:bg-crema focus-visible:outline-2 focus-visible:outline-cream">Entrar</button>
  </form>

  <form id="form-cad" role="tabpanel" aria-labelledby="tab-cad" class="mt-6 hidden space-y-4 rounded-3xl bg-moss p-6 frame" novalidate>
    <div>
      <label for="c-nome" class="text-sm font-semibold">Nome</label>
      <input id="c-nome" autocomplete="name" maxlength="80" required class="inp">
    </div>
    <div>
      <label for="c-email" class="text-sm font-semibold">E-mail</label>
      <input id="c-email" type="email" autocomplete="email" maxlength="200" required class="inp">
    </div>
    <div>
      <label for="c-senha" class="text-sm font-semibold">Senha</label>
      <input id="c-senha" type="password" autocomplete="new-password" minlength="8" required aria-describedby="c-dica" class="inp">
      <p id="c-dica" class="mt-1 text-xs text-cream/60">Pelo menos 8 caracteres.</p>
    </div>
    <p id="c-err" class="hidden rounded-xl bg-rust/15 px-3 py-2 text-sm text-rust" role="alert"></p>
    <button class="w-full rounded-full bg-amber px-6 py-3 font-semibold text-forest hover:bg-crema focus-visible:outline-2 focus-visible:outline-cream">Criar conta</button>
  </form>
</main>

<footer class="mx-auto max-w-5xl px-5 pb-10 text-sm text-cream/60">
  Baggins Coffee. Sempre cabe um segundo café da manhã.
</footer>

<script src="js/common.js"></script>
<script src="js/entrar.js"></script>
</body>
</html>
